<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLATech | ImpactTek Defense Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: {
                        brand: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
                        soc: { bg: '#020617', panel: '#0f172a', border: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen w-full">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IAM_DB = [
            { id: "EMP-084", user: "j.smith", name: "John Smith", role: "Senior Accountant", dept: "Finance", loc: "Chicago, IL", risk: "Low" },
            { id: "EMP-102", user: "a.vance", name: "Alyx Vance", role: "DevOps Engineer", dept: "Engineering", loc: "Seattle, WA", risk: "Elevated" },
            { id: "SYS-001", user: "administrator", name: "Local System Admin", role: "Built-in Account", dept: "IT Infrastructure", loc: "Local Endpoint", risk: "Critical" }
        ];

        const TICKETS = [
            {
                id: 2,
                title: "Brute Force: Local Admin",
                sev: "SEV-1",
                time: "44m ago",
                desc: "Security telemetry shows repeated failed authentication attempts against a privileged local account on the endpoint.",
                requires: "Targeted Account Name",
                gradeLogic: (ans) => ans.toLowerCase().includes("administrator") || ans.toLowerCase().includes("admin"),
                escLogic: (status) => status === 'Active' ? "Correct. Repeated failed logons against a privileged account should be escalated." : "Acknowledge the alert first, then confirm which account is being targeted.",
                methodology: `
                    <p class="mb-2 text-brand-400 font-bold text-[10px] uppercase tracking-widest">Shift-Lead Review</p>
                    <p class="mb-2">1. Search the Windows Security logs for failed authentication activity.</p>
                    <p class="mb-2">2. Focus on Event ID 4625 and review the failed account details.</p>
                    <p>3. The targeted account is <b>Administrator</b>.</p>
                `
            }
        ];

        function App() {
            const [tickets, setTickets] = useState(TICKETS.map(t => ({ ...t, status: 'New', analyst: null })));
            const [selectedId, setSelectedId] = useState(2);
            const t = tickets.find(ticket => ticket.id === selectedId);

            const [activeTab, setActiveTab] = useState('intelligence');
            const [verdict, setVerdict] = useState('');
            const [ioc, setIoc] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [isMobileOpen, setIsMobileOpen] = useState(false);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); });

            const handleSelectTicket = (id) => {
                setSelectedId(id);
                setActiveTab('intelligence');
                setVerdict('');
                setIoc('');
                setFeedback(null);
                setIsMobileOpen(false);
            };

            const handleAction = (action) => {
                if (action === 'ack' && t.status === 'New') {
                    setTickets(prev => prev.map(item => item.id === selectedId ? {...item, status: 'Active', analyst: 'Analyst_01'} : item));
                } else if (action === 'esc' && t.status !== 'Closed' && t.status !== 'Escalated') {
                    setFeedback({ type: 'info', text: t.escLogic(t.status), showExp: false });
                    setTickets(prev => prev.map(item => item.id === selectedId ? {...item, status: 'Escalated'} : item));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (t.status === 'Escalated') return;
                const isCorrect = t.gradeLogic(ioc) && verdict === 'True Positive';
                setFeedback({
                    type: isCorrect ? 'success' : 'error',
                    text: isCorrect ? "Disposition Verified. Report successfully filed." : "Validation Failed. Review the failed logon events and identify the targeted account.",
                    showExp: false
                });
                setTickets(prev => prev.map(item => item.id === selectedId ? {...item, status: 'Closed'} : item));
            };

            return (
                <div className="flex h-screen w-full relative">
                    <aside className={`fixed inset-y-0 left-0 z-50 w-80 bg-soc-panel border-r border-soc-border flex flex-col transition-transform md:relative md:translate-x-0 ${isMobileOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 border-b border-soc-border flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter text-white flex items-center gap-2">
                                    <i data-lucide="shield-alert" className="text-brand-500"></i> MLATech
                                </h1>
                                <p className="text-[9px] text-slate-500 uppercase tracking-[0.3em] mt-1 font-bold">ImpactTek Defense Suite</p>
                            </div>
                            <button onClick={() => setIsMobileOpen(false)} className="md:hidden text-slate-400"><i data-lucide="x"></i></button>
                        </div>

                        <div className="p-4 bg-slate-900/50 border-b border-soc-border text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="list" className="w-4 h-4"></i> Alert Queue
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                            {tickets.map(item => (
                                <div key={item.id} onClick={() => handleSelectTicket(item.id)}
                                    className={`p-4 rounded-xl border transition-all cursor-pointer ${selectedId === item.id ? 'bg-brand-500/10 border-brand-500 shadow-lg' : 'bg-slate-900/40 border-soc-border hover:border-slate-500'}`}>
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="text-[10px] font-black px-2 py-0.5 rounded-sm uppercase tracking-wider bg-orange-500 text-white">{item.sev}</span>
                                        <span className={`text-[10px] font-bold uppercase ${item.status === 'New' ? 'text-brand-400' : item.status === 'Active' ? 'text-yellow-400' : item.status === 'Closed' ? 'text-emerald-400' : 'text-red-400'}`}>{item.status}</span>
                                    </div>
                                    <h3 className="text-sm font-semibold text-slate-200 truncate">{item.title}</h3>
                                </div>
                            ))}
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col bg-soc-bg overflow-hidden relative">
                        <header className="glass p-4 md:p-6 border-b border-soc-border flex justify-between items-center z-10 sticky top-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsMobileOpen(true)} className="md:hidden p-2 text-slate-300"><i data-lucide="menu"></i></button>
                                <div>
                                    <h2 className="text-sm md:text-xl font-bold text-white tracking-tight">CASE_{t.id}00{t.id} // {t.title}</h2>
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Assigned Analyst: {t.analyst || 'WAITING_FOR_ACK'}</p>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => handleAction('ack')} disabled={t.status !== 'New'} className="px-4 py-2 text-[10px] font-bold bg-slate-800 border border-slate-600 rounded-lg hover:bg-slate-700 disabled:opacity-50 uppercase tracking-widest transition-all">Acknowledge</button>
                                <button onClick={() => handleAction('esc')} disabled={t.status === 'Closed' || t.status === 'Escalated'} className="px-4 py-2 text-[10px] font-bold bg-red-900/20 text-red-400 border border-red-900/50 rounded-lg hover:bg-red-900/40 disabled:opacity-50 uppercase tracking-widest transition-all">Escalate</button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 custom-scrollbar pb-24">
                            <div className="flex gap-8 border-b border-soc-border overflow-x-auto">
                                {['intelligence', 'identity_access'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)}
                                        className={`pb-4 text-[11px] font-bold uppercase tracking-[0.15em] transition-all whitespace-nowrap border-b-2 ${activeTab === tab ? 'text-brand-400 border-brand-400' : 'text-slate-500 border-transparent hover:text-slate-300'}`}>
                                        {tab.replace('_', ' & ')}
                                    </button>
                                ))}
                            </div>

                            <section className="min-h-[280px]">
                                {activeTab === 'intelligence' && (
                                    <div className="slide-up space-y-6 max-w-4xl">
                                        <p className="text-slate-300 text-sm md:text-base leading-relaxed">{t.desc}</p>
                                        <div className="bg-black/40 border border-soc-border p-6 rounded-xl font-mono text-xs text-emerald-500 shadow-inner space-y-2">
                                            <p className="text-brand-500 font-bold">// SYSTEM DIRECTIVE</p>
                                            <p>&gt; Review Windows Security authentication failures on the endpoint.</p>
                                            <p>&gt; Focus on failed logon activity tied to a privileged account.</p>
                                            <p>&gt; Extract Primary IOC: <span className="text-white font-bold">{t.requires}</span></p>
                                            <p>&gt; Submit Findings to Disposition Engine.</p>
                                        </div>
                                    </div>
                                )}
                                {activeTab === 'identity_access' && <IAMDirectory />}
                            </section>

                            <section className="glass rounded-2xl p-6 md:p-8 shadow-2xl border border-white/5 max-w-4xl">
                                <h3 className="text-xs font-bold text-brand-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                                    <i data-lucide="clipboard-check" className="w-5 h-5"></i> Incident Disposition Engine
                                </h3>
                                <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Final Verdict</label>
                                        <select required value={verdict} onChange={e => setVerdict(e.target.value)} disabled={t.status === 'Escalated'}
                                            className="w-full bg-soc-bg border border-soc-border p-4 rounded-xl text-sm focus:border-brand-500 outline-none transition-all disabled:opacity-50">
                                            <option value="">Select Verdict...</option>
                                            <option value="True Positive">True Positive (Confirmed Threat)</option>
                                            <option value="False Positive">False Positive (Benign Activity)</option>
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Extracted IOC ({t.requires})</label>
                                        <input required type="text" value={ioc} onChange={e => setIoc(e.target.value)} disabled={t.status === 'Escalated'}
                                            placeholder="Enter extracted data from SIEM..."
                                            className="w-full bg-soc-bg border border-soc-border p-4 rounded-xl text-sm font-mono focus:border-brand-500 outline-none transition-all disabled:opacity-50" />
                                    </div>
                                    <button disabled={t.status === 'Escalated'} className="md:col-span-2 py-4 bg-brand-600 hover:bg-brand-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold rounded-xl transition-all shadow-lg text-[10px] tracking-[0.2em] uppercase">
                                        Submit Triage Report
                                    </button>
                                </form>

                                {feedback && (
                                    <div className={`mt-8 p-6 rounded-xl border slide-up ${feedback.type === 'success' ? 'bg-emerald-500/10 border-emerald-500/30' : feedback.type === 'info' ? 'bg-blue-500/10 border-blue-500/30' : 'bg-red-500/10 border-red-500/30'}`}>
                                        <div className="flex justify-between items-center flex-wrap gap-4">
                                            <p className={`font-bold text-xs uppercase tracking-wider flex items-center gap-2 ${feedback.type === 'success' ? 'text-emerald-400' : feedback.type === 'info' ? 'text-blue-400' : 'text-red-400'}`}>
                                                <i data-lucide={feedback.type === 'success' ? 'check-circle' : 'alert-circle'} className="w-5 h-5"></i> {feedback.text}
                                            </p>
                                            <button onClick={() => setFeedback({...feedback, showExp: !feedback.showExp})} className="text-[10px] bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 uppercase font-bold tracking-widest transition-all">
                                                {feedback.showExp ? 'Hide Review' : 'Request Shift-Lead Review'}
                                            </button>
                                        </div>

                                        {feedback.showExp && (
                                            <div className="mt-6 pt-6 border-t border-white/10 text-slate-300 text-sm leading-relaxed slide-up"
                                                dangerouslySetInnerHTML={{ __html: t.methodology }} />
                                        )}
                                    </div>
                                )}
                            </section>
                        </div>
                    </main>
                </div>
            );
        }

        function IAMDirectory() {
            const [q, setQ] = useState('');
            const [res, setRes] = useState([]);
            const [searched, setSearched] = useState(false);

            const check = (e) => {
                e.preventDefault();
                setSearched(true);
                if (!q) { setRes([]); return; }
                const filtered = IAM_DB.filter(e => e.name.toLowerCase().includes(q.toLowerCase()) || e.user.toLowerCase().includes(q.toLowerCase()));
                setRes(filtered);
            };

            return (
                <div className="space-y-6 max-w-4xl slide-up">
                    <form onSubmit={check} className="flex gap-3">
                        <div className="relative flex-1">
                            <i data-lucide="search" className="absolute left-4 top-4 w-5 h-5 text-slate-500"></i>
                            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search Corporate Identity by Name or Username..." className="w-full bg-soc-bg border border-soc-border p-4 pl-12 rounded-xl text-sm outline-none focus:border-brand-500 transition-all" />
                        </div>
                        <button type="submit" className="bg-slate-800 px-8 py-4 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-700 transition-all border border-slate-700">Query IAM</button>
                    </form>

                    <div className="space-y-4">
                        {searched && res.length === 0 && (
                            <div className="p-8 text-center bg-red-500/10 border border-red-500/20 rounded-xl">
                                <i data-lucide="user-x" className="w-8 h-8 text-red-500 mx-auto mb-3"></i>
                                <p className="text-red-400 text-xs font-bold uppercase tracking-widest">No Identity Records Found</p>
                                <p className="text-slate-500 text-[10px] mt-2 italic">Identity is likely external or not present in the directory.</p>
                            </div>
                        )}

                        {res.map(emp => (
                            <div key={emp.id} className="bg-slate-800/40 border border-soc-border p-6 rounded-xl grid grid-cols-2 sm:grid-cols-3 gap-6 text-xs slide-up">
                                <div><p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Full Name</p>{emp.name}</div>
                                <div><p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Username</p><span className="font-mono text-brand-400">{emp.user}</span></div>
                                <div><p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Home Office</p>{emp.loc}</div>
                                <div><p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Department</p>{emp.dept}</div>
                                <div><p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Security Profile</p><span className={emp.risk === 'Low' ? 'text-emerald-400' : emp.risk === 'Elevated' ? 'text-yellow-400' : 'text-red-400'}>{emp.risk} Risk</span></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
