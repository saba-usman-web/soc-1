<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLATech | ImpactTek Defense Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    },
                    colors: {
                        brand: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
                        soc: { bg: '#020617', panel: '#0f172a', border: '#1e293b' }
                    },
                    boxShadow: {
                        glow: '0 0 0 1px rgba(34,211,238,0.10), 0 10px 40px rgba(2,6,23,0.35)'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background:
                radial-gradient(circle at top right, rgba(34,211,238,0.08), transparent 22%),
                radial-gradient(circle at bottom left, rgba(8,145,178,0.06), transparent 28%),
                #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .glass {
            background: rgba(15, 23, 42, 0.84);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .slide-up { animation: slideUp 0.28s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .noise { position: relative; }
        .noise::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
        }
    </style>
</head>
<body class="flex h-screen w-full">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IAM_DB = [
            {
                id: "EMP-084",
                user: "j.smith",
                name: "John Smith",
                role: "Senior Accountant",
                dept: "Finance",
                loc: "Chicago, IL",
                risk: "Low"
            }
        ];

        const normalizeText = (value) => {
            return value
                .trim()
                .toLowerCase()
                .replace(/\s+/g, ' ');
        };

        const TICKET = {
            id: 1,
            title: "Impossible Travel: Cloud Identity",
            sev: "SEV-2",
            time: "12m ago",
            status: "New",
            desc: "Cloud identity telemetry flagged geographically inconsistent sign-in activity for j.smith@company.local within a short time window.",
            requires: "Final Assessment",
            acceptedAssessments: [
                "vpn activity",
                "proxy activity",
                "mobile carrier routing",
                "benign routed traffic"
            ],
            gradeLogic: (verdict, answer) => {
                const normalized = normalizeText(answer);
                return verdict === 'False Positive' && TICKET.acceptedAssessments.includes(normalized);
            },
            shiftLeadHtml: `
                <p class="mb-2 text-brand-400 font-bold text-[10px] uppercase tracking-widest">Shift-Lead Review</p>
                <p class="mb-2">1. The alert was generated from geolocation variance over a short period.</p>
                <p class="mb-2">2. Session review shows continuity that is more consistent with benign network path changes than separate hostile sessions.</p>
                <p class="mb-2">3. The approved benign assessments for this case are: VPN activity, Proxy activity, Mobile carrier routing, or Benign routed traffic.</p>
                <p>4. Final disposition: <b>False Positive</b>.</p>
            `
        };

        function App() {
            const [ticket, setTicket] = useState({ ...TICKET, analyst: null, status: 'New' });
            const [activeTab, setActiveTab] = useState('intelligence');
            const [verdict, setVerdict] = useState('');
            const [assessment, setAssessment] = useState('');
            const [feedback, setFeedback] = useState(null);
            const [isMobileOpen, setIsMobileOpen] = useState(false);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const handleAction = (action) => {
                if (action === 'ack' && ticket.status === 'New') {
                    setTicket(prev => ({ ...prev, status: 'Active', analyst: 'Analyst_01' }));
                } else if (action === 'esc' && ticket.status !== 'Closed' && ticket.status !== 'Escalated') {
                    setFeedback({
                        type: 'info',
                        text: ticket.status === 'Active'
                            ? "Escalation submitted. Reconfirm context before classifying the sign-in pattern as compromise."
                            : "Acknowledge the case first, then escalate only if the investigation supports compromise.",
                        showExp: false
                    });
                    setTicket(prev => ({ ...prev, status: 'Escalated' }));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (ticket.status === 'Escalated') return;

                const correct = ticket.gradeLogic(verdict, assessment);

                setFeedback({
                    type: correct ? 'success' : 'error',
                    text: correct
                        ? "Disposition Verified. Triage report accepted."
                        : "Validation Failed. Reassess the sign-in context and submit one of the approved benign assessments if the alert is non-malicious.",
                    showExp: false
                });

                setTicket(prev => ({ ...prev, status: 'Closed' }));
            };

            return (
                <div className="flex h-screen w-full relative noise">
                    <aside className={`fixed inset-y-0 left-0 z-50 w-80 bg-soc-panel border-r border-soc-border flex flex-col transition-transform md:relative md:translate-x-0 ${isMobileOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 border-b border-soc-border flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter text-white flex items-center gap-2">
                                    <i data-lucide="shield-alert" className="text-brand-500"></i>
                                    MLATech
                                </h1>
                                <p className="text-[9px] text-slate-500 uppercase tracking-[0.3em] mt-1 font-bold">ImpactTek Defense Suite</p>
                            </div>
                            <button onClick={() => setIsMobileOpen(false)} className="md:hidden text-slate-400">
                                <i data-lucide="x"></i>
                            </button>
                        </div>

                        <div className="p-4 bg-slate-900/50 border-b border-soc-border text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="list" className="w-4 h-4"></i>
                            Alert Queue
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 custom-scrollbar">
                            <div className="p-4 rounded-2xl border bg-brand-500/10 border-brand-500 shadow-glow cursor-default">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-[10px] font-black px-2 py-0.5 rounded-sm uppercase tracking-wider bg-yellow-500 text-black">
                                        {ticket.sev}
                                    </span>
                                    <span className={`text-[10px] font-bold uppercase ${
                                        ticket.status === 'New'
                                            ? 'text-brand-400'
                                            : ticket.status === 'Active'
                                            ? 'text-yellow-400'
                                            : ticket.status === 'Closed'
                                            ? 'text-emerald-400'
                                            : 'text-red-400'
                                    }`}>
                                        {ticket.status}
                                    </span>
                                </div>
                                <h3 className="text-sm font-semibold text-slate-100">{ticket.title}</h3>
                                <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-3">{ticket.time}</p>
                            </div>
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col bg-soc-bg overflow-hidden relative">
                        <header className="glass p-4 md:p-6 border-b border-soc-border flex justify-between items-center z-10 sticky top-0">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsMobileOpen(true)} className="md:hidden p-2 text-slate-300">
                                    <i data-lucide="menu"></i>
                                </button>
                                <div>
                                    <h2 className="text-sm md:text-xl font-bold text-white tracking-tight">
                                        CASE_1001 // {ticket.title}
                                    </h2>
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mt-1">
                                        Assigned Analyst: {ticket.analyst || 'WAITING_FOR_ACK'}
                                    </p>
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => handleAction('ack')}
                                    disabled={ticket.status !== 'New'}
                                    className="px-4 py-2 text-[10px] font-bold bg-slate-800 border border-slate-600 rounded-lg hover:bg-slate-700 disabled:opacity-50 uppercase tracking-widest transition-all"
                                >
                                    Acknowledge
                                </button>
                                <button
                                    onClick={() => handleAction('esc')}
                                    disabled={ticket.status === 'Closed' || ticket.status === 'Escalated'}
                                    className="px-4 py-2 text-[10px] font-bold bg-red-900/20 text-red-400 border border-red-900/50 rounded-lg hover:bg-red-900/40 disabled:opacity-50 uppercase tracking-widest transition-all"
                                >
                                    Escalate
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 custom-scrollbar pb-24">
                            <div className="flex gap-8 border-b border-soc-border overflow-x-auto hide-scroll">
                                {['intelligence', 'identity_access'].map(tab => (
                                    <button
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        className={`pb-4 text-[11px] font-bold uppercase tracking-[0.15em] transition-all whitespace-nowrap border-b-2 ${
                                            activeTab === tab
                                                ? 'text-brand-400 border-brand-400'
                                                : 'text-slate-500 border-transparent hover:text-slate-300'
                                        }`}
                                    >
                                        {tab.replace(/_/g, ' ')}
                                    </button>
                                ))}
                            </div>

                            <section className="min-h-[280px]">
                                {activeTab === 'intelligence' && (
                                    <div className="slide-up space-y-6 max-w-4xl">
                                        <p className="text-slate-300 text-sm md:text-base leading-relaxed">
                                            {ticket.desc}
                                        </p>

                                        <div className="bg-black/40 border border-soc-border p-6 rounded-xl font-mono text-xs text-emerald-500 shadow-inner space-y-2">
                                            <p className="text-brand-500 font-bold">// SYSTEM DIRECTIVE</p>
                                            <p>&gt; Review cloud sign-in activity related to this identity.</p>
                                            <p>&gt; Determine whether the alert represents compromise or benign routed access.</p>
                                            <p>&gt; If benign, approved final assessments are:</p>
                                            <p>&gt; VPN activity / Proxy activity / Mobile carrier routing / Benign routed traffic</p>
                                            <p>&gt; If there is a suspicious IP address, enter it in IPv4 format.</p>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'identity_access' && (
                                    <IAMDirectory />
                                )}
                            </section>

                            <section className="glass rounded-2xl p-6 md:p-8 shadow-2xl border border-white/5 max-w-4xl">
                                <h3 className="text-xs font-bold text-brand-400 uppercase tracking-widest mb-6 flex items-center gap-2">
                                    <i data-lucide="clipboard-check" className="w-5 h-5"></i>
                                    Incident Disposition Engine
                                </h3>

                                <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Final Verdict</label>
                                        <select
                                            required
                                            value={verdict}
                                            onChange={e => setVerdict(e.target.value)}
                                            disabled={ticket.status === 'Escalated'}
                                            className="w-full bg-soc-bg border border-soc-border p-4 rounded-xl text-sm focus:border-brand-500 outline-none transition-all disabled:opacity-50"
                                        >
                                            <option value="">Select Verdict...</option>
                                            <option value="True Positive">True Positive (Confirmed Threat)</option>
                                            <option value="False Positive">False Positive (Benign Activity)</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                                            Final Assessment
                                        </label>
                                        <input
                                            required
                                            type="text"
                                            value={assessment}
                                            onChange={e => setAssessment(e.target.value)}
                                            disabled={ticket.status === 'Escalated'}
                                            className="w-full bg-soc-bg border border-soc-border p-4 rounded-xl text-sm font-mono focus:border-brand-500 outline-none transition-all disabled:opacity-50"
                                        />
                                    </div>

                                    <button
                                        disabled={ticket.status === 'Escalated'}
                                        className="md:col-span-2 py-4 bg-brand-600 hover:bg-brand-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold rounded-xl transition-all shadow-lg text-[10px] tracking-[0.2em] uppercase"
                                    >
                                        Submit Triage Report
                                    </button>
                                </form>

                                {feedback && (
                                    <div className={`mt-8 p-6 rounded-xl border slide-up ${
                                        feedback.type === 'success'
                                            ? 'bg-emerald-500/10 border-emerald-500/30'
                                            : feedback.type === 'info'
                                            ? 'bg-blue-500/10 border-blue-500/30'
                                            : 'bg-red-500/10 border-red-500/30'
                                    }`}>
                                        <div className="flex justify-between items-center flex-wrap gap-4">
                                            <p className={`font-bold text-xs uppercase tracking-wider flex items-center gap-2 ${
                                                feedback.type === 'success'
                                                    ? 'text-emerald-400'
                                                    : feedback.type === 'info'
                                                    ? 'text-blue-400'
                                                    : 'text-red-400'
                                            }`}>
                                                <i data-lucide={feedback.type === 'success' ? 'check-circle' : 'alert-circle'} className="w-5 h-5"></i>
                                                {feedback.text}
                                            </p>

                                            <button
                                                onClick={() => setFeedback({ ...feedback, showExp: !feedback.showExp })}
                                                className="text-[10px] bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 uppercase font-bold tracking-widest transition-all"
                                            >
                                                {feedback.showExp ? 'Hide Review' : 'Request Shift-Lead Review'}
                                            </button>
                                        </div>

                                        {feedback.showExp && (
                                            <div
                                                className="mt-6 pt-6 border-t border-white/10 text-slate-300 text-sm leading-relaxed slide-up"
                                                dangerouslySetInnerHTML={{ __html: ticket.shiftLeadHtml }}
                                            />
                                        )}
                                    </div>
                                )}
                            </section>
                        </div>
                    </main>
                </div>
            );
        }

        function IAMDirectory() {
            const [q, setQ] = useState('');
            const [res, setRes] = useState([]);
            const [searched, setSearched] = useState(false);

            const check = (e) => {
                e.preventDefault();
                setSearched(true);
                if (!q) { setRes([]); return; }

                const filtered = IAM_DB.filter(emp =>
                    emp.name.toLowerCase().includes(q.toLowerCase()) ||
                    emp.user.toLowerCase().includes(q.toLowerCase())
                );

                setRes(filtered);
            };

            return (
                <div className="space-y-6 max-w-4xl slide-up">
                    <form onSubmit={check} className="flex gap-3">
                        <div className="relative flex-1">
                            <i data-lucide="search" className="absolute left-4 top-4 w-5 h-5 text-slate-500"></i>
                            <input
                                value={q}
                                onChange={e => setQ(e.target.value)}
                                placeholder="Search Corporate Identity by Name or Username..."
                                className="w-full bg-soc-bg border border-soc-border p-4 pl-12 rounded-xl text-sm outline-none focus:border-brand-500 transition-all"
                            />
                        </div>
                        <button
                            type="submit"
                            className="bg-slate-800 px-8 py-4 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-700 transition-all border border-slate-700"
                        >
                            Query IAM
                        </button>
                    </form>

                    <div className="space-y-4">
                        {searched && res.length === 0 && (
                            <div className="p-8 text-center bg-red-500/10 border border-red-500/20 rounded-xl">
                                <i data-lucide="user-x" className="w-8 h-8 text-red-500 mx-auto mb-3"></i>
                                <p className="text-red-400 text-xs font-bold uppercase tracking-widest">No Identity Records Found</p>
                                <p className="text-slate-500 text-[10px] mt-2 italic">No corporate identity matched the query.</p>
                            </div>
                        )}

                        {res.map(emp => (
                            <div key={emp.id} className="bg-slate-800/40 border border-soc-border p-6 rounded-xl grid grid-cols-2 sm:grid-cols-3 gap-6 text-xs slide-up">
                                <div>
                                    <p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Full Name</p>
                                    {emp.name}
                                </div>
                                <div>
                                    <p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Username</p>
                                    <span className="font-mono text-brand-400">{emp.user}</span>
                                </div>
                                <div>
                                    <p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Home Office</p>
                                    {emp.loc}
                                </div>
                                <div>
                                    <p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Department</p>
                                    {emp.dept}
                                </div>
                                <div>
                                    <p className="text-slate-500 uppercase font-bold text-[9px] mb-1 tracking-widest">Security Profile</p>
                                    <span className="text-emerald-400">{emp.risk} Risk</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
